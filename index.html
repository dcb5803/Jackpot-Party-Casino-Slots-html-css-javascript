<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Classic Slots</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="slot-machine">
        <div class="header">
            <h1>CHAITANYA BABU JACKSPOT Slots</h1>
            <p class="balance">Balance: $1000</p>
        </div>
        <div class="reels-container">
            <div class="reel" id="reel-0"></div>
            <div class="reel" id="reel-1"></div>
            <div class="reel" id="reel-2"></div>
        </div>
        <div class="controls">
            <button class="btn btn-primary spin_btn">SPIN</button>
            <p class="message">Good Luck!</p>
        </div>

        <audio id="reelSound" src="https://essykings.github.io" loop></audio>
        <audio id="winSound" src="https://essykings.github.io"></audio>
        
        <img src="https://cdn.xsolla.net/strapi-v2-bucket-prod/product_screen_1_538c396630/product_screen_1_538c396630.png" alt="Cherry">
    
    </div>
    <script src="script.js"></script>
</body>
</html>
